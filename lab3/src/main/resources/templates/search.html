<!DOCTYPE html>

<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head><link href="/css/lab2-search.css" rel="stylesheet"/><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><title>拾物集 · 搜索闲置</title><meta name="csrf" th:content="${_csrf.token}"/><meta name="csrf-header" th:content="${_csrf.headerName}"/><meta name="authenticated" th:content="${viewer != null}"/><link href="/css/lab2-integration.css" rel="stylesheet"/><script defer="" src="/js/market.js"></script></head><body>
<div class="app">
<header class="top"><div class="top-row">
<a aria-label="返回首页" class="brand" href="/"><span class="brand-mark"><svg fill="none" height="25" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="25"><path d="M5 8c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3"></path><path d="M5 13c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3"></path><path d="M5 18c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3"></path></svg></span><span><span class="brand-name">拾物集</span><span class="brand-sub">精准发现好物</span></span></a>
<form class="search" id="searchForm"><svg fill="none" height="21" stroke="currentColor" stroke-linecap="round" stroke-width="2.2" viewbox="0 0 24 24" width="21"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4.5 4.5"></path></svg><input aria-label="搜索商品" autocomplete="off" id="keyword" placeholder="输入具体商品名称、品牌或型号"/><button type="submit">搜索商品</button></form>
</div><p class="page-sub">按关键词准确检索，再组合条件缩小范围</p></header>
<main class="content">
<section aria-label="组合筛选" class="block filter-section"><div class="block-head"><div><h1 class="block-title">组合筛选</h1><p class="block-subtitle">支持多个条件同时生效，找到真正合适的闲置</p></div><button class="reset" id="resetFilters" type="button">重置筛选</button></div>
<div class="filter-rows">
<div class="filter-row"><div class="filter-label">价格区间</div><div class="filter-controls"><label class="price-input"><span>¥</span><input aria-label="最低价格" id="minPrice" inputmode="numeric" min="0" placeholder="最低价" type="number"/></label><span class="price-dash">—</span><label class="price-input"><span>¥</span><input aria-label="最高价格" id="maxPrice" inputmode="numeric" min="0" placeholder="最高价" type="number"/></label><span class="price-dash">元</span></div></div>
<div class="filter-row"><div class="filter-label">新旧程度</div><div class="filter-controls" id="conditionGroup"><button class="chip active" data-value="all" type="button">不限</button><button class="chip" data-value="近全新" type="button">近全新</button><button class="chip" data-value="9成新" type="button">9 成新</button><button class="chip" data-value="8成新" type="button">8 成新</button><button class="chip" data-value="7成新" type="button">7 成新及以下</button></div></div>
<div class="filter-row"><div class="filter-label">附近商品</div><div class="near-control"><button aria-pressed="false" class="near-switch" id="nearToggle" type="button"><span class="dot"></span>只看附近</button><select aria-label="附近范围" class="near-select" disabled="" id="nearRadius"><option value="3">3 km 内</option><option selected="" value="5">5 km 内</option><option value="10">10 km 内</option><option value="20">20 km 内</option></select><button class="reset" id="setPosition" type="button">设置位置</button><span id="locationStatus">尚未定位</span></div></div>
<div class="filter-row"><div class="filter-label">卖出量</div><div class="filter-controls" id="soldGroup"><button class="chip active" data-value="0" type="button">不限</button><button class="chip" data-value="5" type="button">已卖 5 件以上</button><button class="chip" data-value="10" type="button">已卖 10 件以上</button><button class="chip" data-value="20" type="button">已卖 20 件以上</button></div></div>
<div class="filter-row"><div class="filter-label">好评率</div><div class="filter-controls" id="ratingGroup"><button class="chip active" data-value="0" type="button">不限</button><button class="chip" data-value="90" type="button">90% 以上</button><button class="chip" data-value="95" type="button">95% 以上</button><button class="chip" data-value="98" type="button">98% 以上</button></div></div>
</div><div class="selected-row"><span class="selected-row-label">已选条件</span><div class="selected-none" id="selectedSummary">尚未筛选，显示全部商品</div></div></section>
<section aria-label="搜索历史" class="block"><div class="history-head"><h2>搜索历史</h2><button class="clear" id="clearHistory" type="button"><svg fill="none" height="15" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24" width="15"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"></path></svg>清空历史</button></div><div class="history-list" id="historyList"></div></section>
<section aria-label="搜索结果" class="results-panel" hidden="" id="resultsPanel"><div class="results-head"><div><h2 id="resultHeading">搜索结果</h2><p id="resultCount">筛选条件支持组合</p></div><select aria-label="排序方式" class="sort-select" id="sortBy"><option value="recommend">综合排序</option><option value="priceAsc">价格从低到高</option><option value="priceDesc">价格从高到低</option><option value="sold">卖出量优先</option><option value="rating">好评率优先</option></select></div>
<div class="results" id="results"></div><div class="placeholder" hidden="" id="noResults"><div class="symbol">⌕</div><strong>没有找到符合条件的商品</strong>试试放宽价格范围或减少筛选条件</div></section>
<div class="placeholder" id="startHint"><div class="symbol">⌕</div><strong>从上方开始搜索闲置好物</strong>输入关键词，或直接组合筛选条件查看商品</div>
<div class="page-links" hidden="" id="searchPages"><button id="previousPage" type="button">上一页</button><span id="pageLabel"></span><button id="nextPage" type="button">下一页</button></div><dialog class="location-dialog" id="locationDialog"><form method="dialog"><h2>附近交易位置</h2><p>选择浏览位置；距离只在当前检索中使用，未提供坐标的商品不进入附近结果。</p><label>纬度<input id="viewerLatitude" max="90" min="-90" step="any" type="number"/></label><label>经度<input id="viewerLongitude" max="180" min="-180" step="any" type="number"/></label><div class="page-links"><button id="locateBrowser" type="button">使用浏览器定位</button><button id="savePosition" type="button">保存位置</button><button>关闭</button></div></form></dialog></main>
<nav aria-label="底部导航" class="bottom-nav" th:replace="~{lab2-fragments :: navigation('nearby')}"><a class="nav" href="secondhand_marketplace_home.html"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3z"></path><path d="M9 20v-7h6v7"></path></svg><span>首页</span></a>
<button class="nav active" onclick="notify('当前为搜索页面，附近筛选请使用上方的距离条件')" type="button"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4.5 4.5"></path></svg><span>搜索 / 附近</span></button>
<button class="nav sell-nav" onclick="notify('出售商品页面正在设计中')" type="button"><span class="sell-btn"><svg fill="none" stroke="currentColor" stroke-linecap="round" viewbox="0 0 24 24"><path d="M12 4v16M4 12h16"></path></svg></span><span>出售商品</span></button>
<button class="nav" onclick="notify('消息页面正在设计中')" type="button"><svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewbox="0 0 24 24"><path d="M4 5h16v13H9l-5 3V5z"></path><path d="M8 10h8M8 14h5"></path></svg><span>消息</span></button>
<button class="nav" onclick="notify('个人中心页面正在设计中')" type="button"><svg fill="none" stroke="currentColor" stroke-linecap="round" viewbox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21c0-4 3.4-6 7.5-6s7.5 2 7.5 6"></path></svg><span>个人资料</span></button></nav>
<div class="toast" id="toast" role="status"></div>
</div>
<script defer="" src="/js/lab2-search.js"></script></body></html>
