<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('购物车')}"></head><body><div class="app"><header th:replace="~{fragments :: header}"></header><main class="content"><h1>购物车</h1>
<form class="panel filters" th:action="@{/cart}" method="get"><label>关键词<input name="keyword"></label><label>分组<input name="group"></label><button>检索购物车</button></form><section class="panel" th:each="r : ${rows}"><h2 th:text="${r.name}"></h2><p th:text="${r.groupName} + ' / 数量 ' + ${r.quantity} + ' / 单价 ¥' + ${r.price}"></p><p class="notice" th:if="${!#strings.isEmpty(r.reason)}" th:text="${r.reason}"></p><form th:if="${#strings.isEmpty(r.reason)}" th:action="@{/cart/{id}/checkout(id=${r.id})}" method="post"><input type="hidden" name="price" th:value="${r.price}"><input type="hidden" name="key" th:value="${key} + '-' + ${r.id}"><button>结算此商品</button></form><form th:action="@{/personal/{id}/delete(id=${r.id})}" method="post"><button>移出购物车</button></form></section>
</main></div></body></html>
