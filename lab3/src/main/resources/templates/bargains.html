<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('议价记录')}"></head><body><div class="app"><header th:replace="~{fragments :: header}"></header><main class="content"><h1>议价记录</h1>
<p>卖家接受后锁定对应库存与价格15分钟，下单后改由订单的15分钟支付占用规则管理。过期库存由定时任务释放。</p><section class="panel" th:each="b : ${items}"><h2 th:text="'议价 #' + ${b.id} + ' / 商品 #' + ${b.productId}"></h2><p th:text="'¥' + ${b.price} + ' × ' + ${b.quantity} + ' / ' + ${b.status}"></p><p th:text="${b.message}"></p><small th:text="${b.expiresAt}"></small><div class="inline" th:if="${viewer.id == b.sellerId and b.status == 'PROPOSED'}"><form th:action="@{/bargains/{id}/accept(id=${b.id})}" method="post"><button>接受并锁库存</button></form><form th:action="@{/bargains/{id}/reject(id=${b.id})}" method="post"><button>拒绝报价</button></form></div><form th:if="${viewer.id == b.buyerId and b.status == 'ACCEPTED'}" th:action="@{/bargains/{id}/order(id=${b.id})}" method="post"><button>按议定价格下单</button></form></section>
</main></div></body></html>
