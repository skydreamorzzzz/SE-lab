<!DOCTYPE html>

<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><link href="/css/lab2-profile.css" rel="stylesheet"/>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, viewport-fit=cover" name="viewport"/>
<title>拾物集 · 个人中心</title>

<meta name="csrf" th:content="${_csrf.token}"/><meta name="csrf-header" th:content="${_csrf.headerName}"/><meta name="authenticated" th:content="${viewer != null}"/><link href="/css/lab2-integration.css" rel="stylesheet"/><script defer="" src="/js/market.js"></script></head>
<body>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden" xmlns="http://www.w3.org/2000/svg">
<symbol id="i-home" viewbox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3z"></path><path d="M9 20v-7h6v7"></path></symbol>
<symbol id="i-pin" viewbox="0 0 24 24"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="2.6"></circle></symbol>
<symbol id="i-plus" viewbox="0 0 24 24"><path d="M12 4v16M4 12h16"></path></symbol>
<symbol id="i-chat" viewbox="0 0 24 24"><path d="M4 5h16v13H9l-5 3V5z"></path><path d="M8 10h8M8 14h5"></path></symbol>
<symbol id="i-user" viewbox="0 0 24 24"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 21c0-4 3.4-6 7.5-6s7.5 2 7.5 6"></path></symbol>
<symbol id="i-heart" viewbox="0 0 24 24"><path d="M20.8 8.6c0 4.4-8.8 10-8.8 10s-8.8-5.6-8.8-10a4.7 4.7 0 0 1 8.8-2.2 4.7 4.7 0 0 1 8.8 2.2Z"></path></symbol>
<symbol id="i-clock" viewbox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></symbol>
<symbol id="i-follow" viewbox="0 0 24 24"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c0-3.7 2.5-6 6.5-6 2 0 3.6.6 4.7 1.7"></path><path d="M18 11v9M13.5 15.5h9"></path></symbol>
<symbol id="i-box" viewbox="0 0 24 24"><path d="m3 7 9-4 9 4v11l-9 4-9-4Z"></path><path d="M3 7l9 4 9-4M12 11v11"></path></symbol>
<symbol id="i-sold" viewbox="0 0 24 24"><path d="M4 9h16v12H4zM7 9V5h10v4"></path><path d="m9 15 2 2 4-4"></path></symbol>
<symbol id="i-bag" viewbox="0 0 24 24"><path d="M5 8h14l1 13H4L5 8Z"></path><path d="M9 9V6a3 3 0 0 1 6 0v3"></path></symbol>
<symbol id="i-shield" viewbox="0 0 24 24"><path d="m12 2 8 3v6c0 5.5-3.7 9-8 11-4.3-2-8-5.5-8-11V5Z"></path><path d="M12 7v6M12 17h.01"></path></symbol>
<symbol id="i-address" viewbox="0 0 24 24"><path d="M4 3h16v18H4zM8 8h8M8 12h8M8 16h4"></path></symbol>
<symbol id="i-lock" viewbox="0 0 24 24"><rect height="11" rx="2" width="14" x="5" y="10"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></symbol>
<symbol id="i-help" viewbox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M9 9a3 3 0 1 1 5 2c-1.4 1.2-2 1.3-2 3M12 17h.01"></path></symbol>
<symbol id="i-settings" viewbox="0 0 24 24"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"></path><circle cx="12" cy="12" r="4"></circle></symbol>
<symbol id="i-chevron" viewbox="0 0 24 24"><path d="m9 5 7 7-7 7"></path></symbol>
</svg>
<div class="app">
<header class="topbar"><a class="brand" href="/"><span class="brand-logo"><svg><use href="#i-home"></use></svg></span><strong>拾物集</strong><span class="brand-caption">让好物继续发光</span></a><div class="top-actions"><a href="/search"><svg><circle cx="11" cy="11" r="7"></circle><path d="m16 16 5 5"></path></svg><span class="help-label">搜索</span></a><button aria-label="消息通知" onclick="showModal('消息通知')" type="button"><svg><use href="#i-chat"></use></svg></button></div></header>
<main class="main">
<div class="page-title"><h1>个人中心</h1><span>管理我的闲置和交易</span></div>
<section aria-label="个人资料概览" class="profile-card">
<div class="identity"><span aria-label="示例用户头像" class="avatar"><svg viewbox="0 0 100 100"><circle cx="50" cy="57" fill="#f6b98f" r="44"></circle><path d="M16 46c0-28 13-35 34-35s34 9 34 35c-5-9-17-17-34-17S21 37 16 46Z" fill="#8e6557"></path><circle cx="37" cy="55" fill="#624c48" r="3.3"></circle><circle cx="63" cy="55" fill="#624c48" r="3.3"></circle><path d="M44 70q6 6 13 0" fill="none" stroke="#a65b52" stroke-linecap="round" stroke-width="3"></path></svg><i class="avatar-dot"></i></span><div class="identity-main"><h2><span th:text="${viewer.displayName}"></span> <span class="identity-tag" th:text="${viewer.banned ? '账户受限' : (viewer.trader ? '普通用户' : '管理员')}">信誉良好</span></h2><p th:text="${viewer.city == null or viewer.city == '' ? '尚未填写地区' : viewer.city}">南京 · 校园闲置爱好者</p><div class="hint" th:text="${viewer.bio == null or viewer.bio == '' ? '让闲置找到更好的归宿 ✨' : viewer.bio}">让闲置找到更好的归宿 ✨</div></div></div>
<button class="profile-link" onclick="showModal('详细资料')" type="button">详细资料 <svg><use href="#i-chevron"></use></svg></button>
</section>
<section aria-labelledby="shortcuts-title" class="section"><div class="section-head"><div class="title-bar"><h2 id="shortcuts-title">我的足迹</h2></div><small>把喜欢的好物收进这里</small></div><div class="shortcuts">
<button class="shortcut" onclick="showModal('我的收藏')"><span class="iconbox rose"><svg><use href="#i-heart"></use></svg></span><span><strong>我的收藏</strong><small><span class="count" data-count="FAVORITE">0</span> 件心动好物</small></span></button>
<button class="shortcut" onclick="showModal('历史浏览')"><span class="iconbox amber"><svg><use href="#i-clock"></use></svg></span><span><strong>历史浏览</strong><small>最近看过 <span class="count" data-count="VIEW">0</span> 件</small></span></button>
<button class="shortcut" onclick="showModal('我的关注')"><span class="iconbox lavender"><svg><use href="#i-follow"></use></svg></span><span><strong>我的关注</strong><small>关注了 <span class="count" data-count="FOLLOW">0</span> 位卖家</small></span></button>
</div></section>
<section aria-labelledby="transactions-title" class="section"><div class="section-head"><div class="title-bar"><h2 id="transactions-title">我的交易</h2></div><button class="more-link" onclick="showModal('交易记录')">查看交易记录 ›</button></div><div class="transactions">
<button class="transaction" onclick="showModal('我发布的')"><span class="round"><svg><use href="#i-box"></use></svg></span><strong>我发布的</strong><small>管理在售闲置</small></button>
<button class="transaction" onclick="showModal('我卖出的')"><span class="round"><svg><use href="#i-sold"></use></svg></span><strong>我卖出的</strong><small>已售商品记录</small></button>
<button class="transaction" onclick="showModal('我买到的')"><span class="round"><svg><use href="#i-bag"></use></svg></span><strong>我买到的</strong><small>订单与售后</small></button>
<button class="transaction" onclick="showModal('申请投诉')"><span class="round"><svg><use href="#i-shield"></use></svg></span><strong>申请投诉</strong><small>举报与申诉</small></button>
</div></section>
<section aria-label="其他功能" class="section"><div class="section-head"><div class="title-bar"><h2>其他服务</h2></div></div><div class="utilities">
<button class="utility" onclick="showModal('收货地址')"><svg><use href="#i-address"></use></svg>收货地址</button>
<button class="utility" onclick="showModal('账户与安全')"><svg><use href="#i-lock"></use></svg>账户与安全</button>
<button class="utility" onclick="showModal('帮助中心')"><svg><use href="#i-help"></use></svg>帮助中心</button>
<button class="utility" onclick="showModal('设置')"><svg><use href="#i-settings"></use></svg>设置</button>
<a class="utility" href="/cart">购物车</a><a class="utility" href="/reservations">商品预约</a><a class="utility" href="/bargains">议价记录</a><a class="utility" href="/admin" th:if="${viewer.role == 'ADMIN'}">管理后台</a><form class="utility" method="post" th:action="@{/logout}"><button>退出登录</button></form></div></section>
<div class="footer-note">拾物集 · 让每一件闲置都物有所值</div>
</main>
<nav aria-label="底部导航" class="bottom-nav" th:replace="~{lab2-fragments :: navigation('profile')}">
<a class="nav" href="secondhand_marketplace_home.html"><svg><use href="#i-home"></use></svg><span>首页</span></a>
<a class="nav" href="secondhand_marketplace_home.html?tab=nearby"><svg><use href="#i-pin"></use></svg><span>附近商品</span></a>
<a class="nav sell-nav" href="secondhand_marketplace_sell.html"><span class="sell-btn"><svg><use href="#i-plus"></use></svg></span><span>出售商品</span></a>
<button class="nav" onclick="showModal('消息通知')"><svg><use href="#i-chat"></use></svg><span>消息</span></button>
<button aria-current="page" class="nav active" type="button"><svg><use href="#i-user"></use></svg><span>个人资料</span></button>
</nav>
</div>
<div aria-hidden="true" class="overlay" id="overlay" onclick="if(event.target===this)closeModal()"><div aria-labelledby="modalTitle" aria-modal="true" class="modal" role="dialog"><div class="modal-head"><h2 id="modalTitle">我的收藏</h2><button aria-label="关闭" class="modal-close" onclick="closeModal()">×</button></div><p class="modal-caption" id="modalCaption">正在读取我的记录</p><div id="modalBody"></div><div class="modal-foot"><button class="primary" onclick="closeModal()">完成</button></div></div></div>
<div aria-live="polite" class="toast" id="toast" role="status"></div>

<script defer="" src="/js/lab2-profile.js"></script></body>
</html>
