<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('身份验证与恢复凭证')}"></head><body><div class="app"><header th:replace="~{fragments :: header}"></header><main class="content"><h1>身份验证与恢复凭证</h1>
<p th:text="'绑定手机号：' + ${viewer.phone ?: '尚未绑定'}"></p><p class="notice" th:if="${result != null}" th:text="${result}"></p><form class="panel stack" th:action="@{/identity/recovery}" method="post"><h2>生成一次性恢复凭证</h2><p>请离线保存凭证。遗忘密码后可凭此重设；重新生成会撤销旧凭证，使用一次后失效。</p><label>当前密码<input type="password" name="password" required></label><button>验证并生成恢复凭证</button></form><section class="panel" th:if="${recoveryCode != null}"><strong>仅此次显示，请妥善保存</strong><pre th:text="${recoveryCode}"></pre></section><form class="panel stack" th:action="@{/identity/challenge}" method="post"><h2>绑定手机号</h2><label>当前密码<input type="password" name="password" required></label><label>手机号<input name="phone" pattern="1[3-9][0-9]{9}" required></label><button>本地模拟发送验证码</button></form><section class="panel" th:if="${smsCode != null}"><p>课程演示：未接入短信运营商，本地短信模拟内容如下。</p><b th:text="${smsCode}"></b></section><form class="panel stack" th:action="@{/identity/bind}" method="post"><label>5分钟验证码（最多5次）<input name="code" required></label><button>核验并绑定</button></form>
</main></div></body></html>
