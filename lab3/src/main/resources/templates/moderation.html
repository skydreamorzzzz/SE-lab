<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('举报与申诉')}"></head><body><div class="app"><header th:replace="~{fragments :: header}"></header><main class="content"><h1>举报与申诉</h1>
<p th:text="'我的账户编号 #' + ${viewer.id} + ' / ' + ${viewer.banned ? '已封禁，可申诉' : '正常'}"></p><p>举报不会自动下架。管理员核实后单独执行违规处置；申诉通过的商品仍需再次审核。</p>
<form class="panel stack" th:action="@{/moderation/submit}" method="post"><label>操作<select name="kind"><option value="REPORT">举报</option><option value="APPEAL">申诉</option><option th:if="${viewer.role == 'ADMIN'}" value="PUNISH">违规处置</option></select></label><label>对象类型<select name="type"><option value="PRODUCT">商品</option><option value="ACCOUNT">账户</option></select></label><label>对象编号<input type="number" name="target" min="1" required></label><label>原因<textarea name="reason" maxlength="500" required></textarea></label><label>举报图片（可选）<input name="image" placeholder="HTTPS图片或本地上传地址"></label><button>提交</button></form>
<section class="panel" th:each="c : ${cases}"><h2 th:text="'#' + ${c.id} + ' ' + ${c.kind} + ' / ' + ${c.status}"></h2><p th:text="${c.targetType} + ' #' + ${c.targetId}"></p><p th:text="${c.reason}"></p><a th:if="${c.imageUrl != null and !#strings.isEmpty(c.imageUrl)}" th:href="${c.imageUrl}">查看举报图片</a><p th:text="${c.feedback}"></p><form class="stack" th:if="${viewer.role == 'ADMIN' and c.status == 'PENDING'}" th:action="@{/moderation/decide}" method="post"><input type="hidden" name="id" th:value="${c.id}"><label>反馈<input name="feedback" maxlength="500" required></label><button name="accept" value="true">受理举报 / 通过申诉</button><button name="accept" value="false">驳回并反馈</button></form></section>
</main></div></body></html>
