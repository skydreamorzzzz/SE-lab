<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('商品详情')}"></head>
<body><div class="app"><header th:replace="~{fragments :: header}"></header>
<main class="content"><h1>商品详情</h1>
<section class="panel"><img class="detail-image" th:src="${product.imageUrl}" th:alt="${product.name}"><a class="button" th:href="@{/sellers/{id}(id=${product.sellerId})}">卖家主页与评价</a><h2 th:text="${product.name}"></h2><span class="price" th:text="${product.minPrice} + ' – ' + ${product.maxPrice}"></span><p th:text="${product.category} + ' · ' + ${product.conditionLabel}"></p><p th:text="${product.status.label} + ' / 库存 ' + ${product.stock}"></p><pre class="description" th:text="${product.description}"></pre><small>直接购买按公开最低价成交；支持议价时可在下方提交区间内报价。</small>
<div th:if="${viewer != null and viewer.role == 'BUYER'}">
<form class="inline" th:if="${product.status.name() == 'ON_SALE'}" th:action="@{/buy/{id}(id=${product.id})}" method="post"><input type="hidden" name="requestKey" th:value="${requestKey}"><input type="hidden" name="displayedPrice" th:value="${product.minPrice}"><label>数量<input type="number" name="quantity" value="1" min="1" th:max="${product.stock}" required></label><button>立即购买</button></form>
<form class="inline" th:if="${product.status.name() == 'SOLD_OUT'}" th:action="@{/reserve/{id}(id=${product.id})}" method="post"><label>预约数量<input type="number" name="quantity" value="1" min="1" required></label><button>申请缺货预约</button><small th:text="'计划预约上限 ' + ${product.reservationLimit}"></small></form></div>
<a th:if="${viewer == null}" th:href="@{/login}">登录后购买或预约</a></section>
<section class="panel"><h2>交易评价</h2><p th:if="${#lists.isEmpty(reviews)}">暂无评价</p><article th:each="r : ${reviews}"><b th:text="${r.rating} + ' / 5'"></b><p th:text="${r.content}"></p><small th:text="'用户 #' + ${r.authorId}"></small></article></section>
<a class="button" th:if="${viewer != null}" th:href="@{/moderation}">举报此商品（对象编号见网址）</a>
<form class="panel stack" th:if="${viewer != null and viewer.role == 'BUYER' and product.negotiable and product.status.name() == 'ON_SALE'}" th:action="@{/bargains/propose}" method="post"><h2>向卖家报价</h2><input type="hidden" name="productId" th:value="${product.id}"><label>单价<input type="number" name="price" step="0.01" th:min="${product.minPrice}" th:max="${product.maxPrice}" required></label><label>数量<input type="number" name="quantity" min="1" value="1" required></label><button>提交报价</button></form>
<div class="panel" th:if="${viewer != null}"><form th:action="@{/personal/toggle}" method="post"><input type="hidden" name="kind" value="FAVORITE"><input type="hidden" name="target" th:value="${product.id}"><button>收藏商品</button></form><form class="inline" th:if="${viewer.role == 'BUYER'}" th:action="@{/cart/add}" method="post"><input type="hidden" name="productId" th:value="${product.id}"><label>数量<input type="number" name="quantity" min="1" value="1" required></label><label>购物车分组<input name="group" value="默认" maxlength="60"></label><button>加入购物车</button></form></div>
<section class="panel"><h2>更多商品信息</h2><p th:text="'品牌 ' + ${product.brand ?: '未填写'} + ' / 型号 ' + ${product.modelName ?: '未填写'} + ' / 年限 ' + ${product.usageYears ?: '未填写'}"></p><p th:text="'产地 ' + ${product.originPlace ?: '未填写'} + ' / 客服 ' + ${product.contactChannel ?: '未填写'} + ' / 发货地址 ' + ${product.shippingAddress ?: '未填写'}"></p><p th:text="${product.returnSupported ? '支持退货' : '退货请通过售后协商'}"></p><img class="detail-image" th:each="u : ${product.extraImages == null or #strings.isEmpty(product.extraImages) ? {} : #strings.arraySplit(product.extraImages, ' ')}" th:src="${u}" alt="商品附图"><video th:if="${product.videoUrl != null and !#strings.isEmpty(product.videoUrl)}" th:src="${product.videoUrl}" controls style="max-width:100%"></video></section>
</main></div></body></html>
