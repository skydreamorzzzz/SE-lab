<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('订单详情')}"></head>
<body><div class="app"><header th:replace="~{fragments :: header}"></header>
<main class="content"><h1>订单详情</h1>
<section class="panel"><h2 th:text="${order.productName}"></h2><dl><dt>订单号</dt><dd th:text="${order.id}"></dd><dt>状态</dt><dd th:text="${order.status.label}"></dd><dt>数量 / 总额</dt><dd th:text="${order.quantity} + ' / ¥' + ${order.total}"></dd><dt>收货地址快照</dt><dd th:text="${order.address}"></dd><dt>模拟支付流水</dt><dd th:text="${order.paymentReference ?: '未支付'}"></dd><dt>模拟物流单号</dt><dd th:text="${order.trackingNumber ?: '未发货'}"></dd></dl>
<div class="inline" th:if="${viewer.id == order.buyerId and order.status.name() == 'PENDING_PAYMENT'}"><p>请在创建后 15 分钟内支付；超时自动取消并释放库存。</p><form th:action="@{/orders/{id}/pay(id=${order.id})}" method="post"><button>模拟支付</button></form><form th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post"><button>取消订单</button></form></div>
<form th:if="${viewer.id == order.sellerId and order.status.name() == 'PAID'}" th:action="@{/orders/{id}/ship(id=${order.id})}" method="post"><button>模拟发货</button></form>
<div class="inline" th:if="${viewer.id == order.buyerId and order.status.name() == 'SHIPPED'}"><form th:if="${order.signedAt == null}" th:action="@{/orders/{id}/sign(id=${order.id})}" method="post"><button>模拟物流签收</button></form><form th:action="@{/orders/{id}/receive(id=${order.id})}" method="post"><button>确认收货</button></form></div>
<small th:if="${order.signedAt != null}">已记录物流签收，签收满 7 天自动确认收货。</small></section>
<form class="panel stack" th:if="${order.status.name() == 'COMPLETED'}" th:action="@{/reviews/{id}(id=${order.id})}" method="post"><h2>交易评价（每方一次）</h2><label>评分<select name="rating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select></label><label>内容<textarea name="content" maxlength="1000" required></textarea></label><button>提交评价</button></form>
</main></div></body></html>
