<!DOCTYPE html>

<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head><link href="/css/lab2-home.css" rel="stylesheet"/>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/>
<title>拾物集 · 二手交易首页</title>
<meta name="csrf" th:content="${_csrf.token}"/><meta name="csrf-header" th:content="${_csrf.headerName}"/><meta name="authenticated" th:content="${viewer != null}"/><link href="/css/lab2-integration.css" rel="stylesheet"/><script defer="" src="/js/market.js"></script></head>
<body>
<div class="app">
<header class="top">
<div class="header">
<a aria-label="拾物集首页" class="brand" href="/">
<span class="brand-mark"><svg fill="none" height="25" stroke="white" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" viewbox="0 0 24 24" width="25"><path d="M5 8c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3"></path><path d="M5 13c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3"></path><path d="M5 18c2.5 0 2.5-3 5-3s2.5 3 5 3 2.5-3 5-3"></path></svg></span>
<span><span class="brand-name">拾物集</span><span class="brand-sub">让闲置遇见新主人</span></span>
</a>
<form action="/search" autocomplete="off" class="search" id="searchForm" method="get">
<svg class="search-icon" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2" viewbox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.5"></circle><path d="m16 16 5 5"></path></svg>
<input aria-label="搜索商品" id="searchInput" name="q" placeholder="搜索你想要的二手好物"/>
<button type="submit">搜索</button>
</form>
<div class="top-actions"><button onclick="Market.go('/messages')" type="button"><svg fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24"><path d="M4 5h16v12H8l-4 4V5z"></path></svg>消息</button></div>
</div>
</header>
<main class="content">
<div class="browse-row"><div class="heading"><h1 id="sectionTitle">为你推荐</h1><small>发现值得再次心动的好物</small></div><div class="sort"><button class="selected" data-sort="recommend" onclick="sortHome(this.dataset.sort)">综合</button><span>|</span><button data-sort="new" onclick="sortHome(this.dataset.sort)">最新</button><span>|</span><button data-sort="price" onclick="sortHome(this.dataset.sort)">价格</button></div></div>
<div aria-label="商品分类" class="filters" role="group">
<button class="filter active" data-filter="全部" onclick="filterHome(this.dataset.filter)" type="button">全部好物</button>
<button class="filter" data-filter="数码" onclick="filterHome(this.dataset.filter)" type="button">数码电子</button>
<button class="filter" data-filter="影音" onclick="filterHome(this.dataset.filter)" type="button">影音设备</button>
<button class="filter" data-filter="家居" onclick="filterHome(this.dataset.filter)" type="button">家居生活</button>
<button class="filter" data-filter="办公" onclick="filterHome(this.dataset.filter)" type="button">办公学习</button>
</div>
<section aria-label="推荐商品" class="catalog" id="catalog">
<article class="product" onclick="Market.go('/products/'+this.dataset.id)" onkeydown="if(event.key==='Enter')this.click()" role="link" tabindex="0" th:attr="data-id=${p.id},data-price=${p.price},data-category=${p.category},data-title=${p.name}" th:each="p : ${items}">
<div class="art" style="background:#f6e7db" th:style="'background:' + ${#strings.startsWith(p.category,'影音') ? '#dfebef' : (#strings.startsWith(p.category,'办公') ? '#eae6ef' : (#strings.startsWith(p.category,'家居') ? '#f4e8dc' : '#f6e7db'))}">
<span class="chip" th:text="${p.statusLabel}">闲置精选</span>
<button aria-label="收藏商品" class="like" onclick="favorite(event,this)" th:attr="data-id=${p.id},aria-pressed=${p.liked}" th:classappend="${p.liked} ? 'active' : ''"><svg fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="1.9" viewbox="0 0 24 24"><path d="M20.8 8.6c0 4.4-8.8 10-8.8 10s-8.8-5.6-8.8-10a4.7 4.7 0 0 1 8.8-2.2 4.7 4.7 0 0 1 8.8 2.2z"></path></svg></button>
<img loading="lazy" th:alt="${p.name}" th:src="${p.imageUrl}"/>
</div>
<div class="product-body"><h2 class="product-title" th:text="${p.name}">复古数码相机 · 九成新</h2><div class="product-desc" th:text="${p.description}">功能完好 / 附原装电池和背带</div><div class="bottom-line"><div><span class="price" th:text="${p.price}">459</span></div><span class="seller"><span class="seller-avatar" th:text="${#strings.substring(p.seller,0,1)}"></span><span th:text="${p.seller}"></span></span></div></div>
</article>
</section>
<div class="empty" id="empty" th:classappend="${#lists.isEmpty(items)} ? 'show' : ''">没有找到匹配的商品，换个关键词试试看吧。</div>
<div class="page-links" th:if="${result.hasNext() or result.hasPrevious()}"><a th:href="@{/(page=${result.number - 1},keyword=${param.keyword},category=${param.category},sort=${param.sort})}" th:if="${result.hasPrevious()}">上一页</a><span th:text="'第 ' + ${result.number + 1} + ' 页'"></span><a th:href="@{/(page=${result.number + 1},keyword=${param.keyword},category=${param.category},sort=${param.sort})}" th:if="${result.hasNext()}">下一页</a></div><div class="page-links"><a href="/ranking">成交榜单</a><a href="/cart">我的购物车</a><a href="/orders">买卖订单</a></div></main>
<nav aria-label="底部导航" class="bottom-nav" th:replace="~{lab2-fragments :: navigation('home')}"></nav>
<div class="toast" id="toast" role="status"></div>
</div>
<script defer="" src="/js/lab2-home.js"></script></body>
</html>
