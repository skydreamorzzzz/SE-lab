<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('平台规则与管理员')}"></head><body><div class="app"><header th:replace="~{fragments :: header}"></header><main class="content"><h1>平台规则与管理员</h1>
<form class="panel stack" th:action="@{/admin/platform/rules}" method="post"><label>抽成比例（0–1）<input type="number" step="0.001" min="0" max="1" name="commission" th:value="${rule.commissionRate}" required></label><label>促销减价比例（0–0.9）<input type="number" step="0.001" min="0" max="0.9" name="promotion" th:value="${rule.promotionRate}" required></label><button>保存平台规则</button></form>
<form class="panel stack" th:action="@{/admin/platform/admin}" method="post"><label>新管理员用户名<input name="username" required></label><label>初始密码<input name="password" type="password" required></label><button>创建普通管理员</button></form>
</main></div></body></html>
