<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('收藏、关注与历史')}"></head><body><div class="app"><header th:replace="~{fragments :: header}"></header><main class="content"><h1>收藏、关注与历史</h1>
<nav class="inline"><a th:href="@{/personal(kind='FAVORITE')}">商品收藏</a><a th:href="@{/personal(kind='FOLLOW')}">关注卖家</a><a th:href="@{/personal(kind='BLOCK')}">屏蔽列表</a><a th:href="@{/personal(kind='VIEW')}">浏览记录</a><a th:href="@{/personal(kind='SEARCH')}">搜索历史</a></nav><section class="panel" th:each="e : ${entries}"><b th:text="${e.kind} + ' / ' + ${e.targetKey}"></b><p th:text="${e.updatedAt}"></p><a th:if="${e.kind == 'FAVORITE' or e.kind == 'VIEW'}" th:href="@{/products/{id}(id=${e.targetId})}">查看商品</a><a th:if="${e.kind == 'FOLLOW'}" th:href="@{/sellers/{id}(id=${e.targetId})}">查看卖家</a><a th:if="${e.kind == 'SEARCH'}" th:href="@{/(keyword=${e.targetKey})}">重新搜索</a><form th:action="@{/personal/{id}/delete(id=${e.id})}" method="post"><button>删除 / 取消关系</button></form></section>
</main></div></body></html>
